name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      dns-exporter--release_created: ${{ steps.release.outputs['charts/dns-exporter--release_created'] }}
      dns-exporter--tag_name: ${{ steps.release.outputs['charts/dns-exporter--tag_name'] }}
      domain-exporter--release_created: ${{ steps.release.outputs['charts/domain-exporter--release_created'] }}
      domain-exporter--tag_name: ${{ steps.release.outputs['charts/domain-exporter--tag_name'] }}
      http-exporter--release_created: ${{ steps.release.outputs['charts/http-exporter--release_created'] }}
      http-exporter--tag_name: ${{ steps.release.outputs['charts/http-exporter--tag_name'] }}
      outline--release_created: ${{ steps.release.outputs['charts/outline--release_created'] }}
      outline--tag_name: ${{ steps.release.outputs['charts/outline--tag_name'] }}
      signatory--release_created: ${{ steps.release.outputs['charts/signatory--release_created'] }}
      signatory--tag_name: ${{ steps.release.outputs['charts/signatory--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.DOCKER_RELEASE_USER }}
          password: ${{ secrets.DOCKER_RELEASE_TOKEN }}

      - name: Package and Publish Released Charts to GHCR
        run: |
          released='${{ needs.release-please.outputs.paths_released }}'
          mkdir -p .oci
          for path in $(echo "$released" | jq -r '.[]'); do
            echo "Packaging $path"
            if [ -f "$path/Chart.lock" ]; then
              helm dependency build "$path"
            fi
            helm package "$path" --destination .oci
          done
          for pkg in .oci/*.tgz; do
            if [ -f "$pkg" ]; then
              echo "Pushing $pkg to GHCR"
              helm push "$pkg" oci://ghcr.io/tenxprotocols/helm-charts
            fi
          done

      - name: Publish Charts to GitHub Pages
        uses: helm/chart-releaser-action@v1.7.0
        with:
          config: .github/configs/cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
