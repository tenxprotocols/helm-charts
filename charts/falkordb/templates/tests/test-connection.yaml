apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "falkordb.fullname" . }}-test-connection"
  labels:
    {{- include "falkordb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: redis-cli
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command: ['redis-cli']
      args: ['-h', '{{ include "falkordb.fullname" . }}', '-p', '{{ .Values.service.port }}', 'ping']
  restartPolicy: Never
