apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gomodel.fullname" . }}-test-connection"
  labels:
    {{- include "gomodel.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # /health is exempt from master-key auth; "/" would return 401 when auth is enabled.
      args: ['{{ include "gomodel.fullname" . }}:{{ .Values.service.port }}/health']
  restartPolicy: Never
