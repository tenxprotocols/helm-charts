---
# Minimal values for `helm template` / `helm lint` smoke tests.
# CT install is intentionally skipped for this chart in CI (the format
# initContainer requires a reachable R2 endpoint).
objectStorage:
  bucket: https://example.r2.cloudflarestorage.com/test
  accessKey: ct-access
  secretKey: ct-secret

gatewayAuth:
  accessKey: ct-gateway-access
  secretKey: ct-gateway-secret

postgres:
  auth:
    password: ct-test-password
  service:
    type: ClusterIP
  storage:
    size: 1Gi
