---
image:
  repository: postgres
  tag: ""
  pullPolicy: IfNotPresent

auth:
  database: postgres
  username: postgres
  # -- Inline password. Ignored when existingSecret is set.
  password: ""
  # -- Name of an existing Secret containing key "password"
  existingSecret: ""

service:
  type: ClusterIP
  port: 5432

storage:
  size: 10Gi
  className: ""
  accessMode: ReadWriteOnce

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

livenessProbe:
  exec:
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  exec:
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- Extra args appended to the `postgres` command. Combined with TLS args when tls.enabled.
extraArgs: []

tls:
  # -- Enable TLS for client connections.
  enabled: false
  # -- Use an existing kubernetes.io/tls Secret containing tls.crt, tls.key.
  # Mutually exclusive with certManager.enabled.
  existingSecret: ""
  certManager:
    # -- Issue the server certificate via cert-manager (renders a Certificate resource).
    enabled: false
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    # -- Cert validity duration (e.g. 8760h). Empty defers to cert-manager default.
    duration: ""
    # -- Renew this long before expiry (e.g. 720h). Empty defers to cert-manager default.
    renewBefore: ""
    # -- DNS names on the cert. When empty, defaults to the four standard service DNS forms.
    dnsNames: []
    # -- Additional IP SANs (useful for known LoadBalancer IPs).
    ipAddresses: []
