apiVersion: v1
kind: Service
metadata:
  name: {{ include "signatory.fullname" . }}
  labels:
    {{- include "signatory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.utilityPort }}
      targetPort: http-alt
      protocol: TCP
      name: http-alt
  selector:
    {{- include "signatory.selectorLabels" . | nindent 4 }}
