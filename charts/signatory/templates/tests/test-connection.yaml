apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "signatory.fullname" . }}-test-connection"
  labels:
    {{- include "signatory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "signatory.fullname" . }}:{{ .Values.service.utilityPort }}/healthz']
  restartPolicy: Never
