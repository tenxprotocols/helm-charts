    version: "0.2.0"
    repository: "oci://ghcr.io/tenxprotocols/helm-charts"
    condition: postgres.enabled
  - name: valkey
    version: "0.2.0"
    repository: "oci://ghcr.io/tenxprotocols/helm-charts"
    condition: valkey.enabled
