{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.namePrefix }}-gateway
  labels:
    {{- include "swarmforge.componentLabels" (dict "component" "gateway" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "swarmforge.componentSelectorLabels" (dict "component" "gateway" "context" .) | nindent 4 }}
{{- end }}
