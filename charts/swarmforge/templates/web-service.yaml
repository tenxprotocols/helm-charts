{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.namePrefix }}-web
  labels:
    {{- include "swarmforge.componentLabels" (dict "component" "web" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "swarmforge.componentSelectorLabels" (dict "component" "web" "context" .) | nindent 4 }}
{{- end }}
