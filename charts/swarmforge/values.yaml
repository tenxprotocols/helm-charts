---
global:
  env: dev
  namePrefix: swarmforge
  imagePullSecrets: []
  #  - name: ghcr-swarmforge

web:
  enabled: true
  image:
    repository: ghcr.io/tenxprotocols/swarmforge/web
    tag: dev
  replicas: 1
  port: 3000
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

gateway:
  enabled: true
  image:
    repository: ghcr.io/tenxprotocols/swarmforge/gateway
    tag: dev
  replicas: 1
  port: 4000
  env: {}
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

worker:
  enabled: true
  image:
    repository: ghcr.io/tenxprotocols/swarmforge/worker
    tag: dev
  replicas: 1
  healthPort: 4001
  env: {}
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 4001
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: 4001
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

marketing:
  enabled: true
  image:
    repository: ghcr.io/tenxprotocols/swarmforge/marketing
    tag: dev
  replicas: 1
  port: 3100
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 3100
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: 3100
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# Database migration init container (runs before gateway starts)
migration:
  enabled: true
  image: {}
  #  repository: ghcr.io/tenxprotocols/swarmforge/gateway
  #  tag: dev
  command: ["node", "packages/db/dist/run-migrate.js"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Required application environment variables
# betterAuthUrl and corsOrigin default to https://<ingress web host> when ingress is enabled
bifrostUrl: ""
betterAuthUrl: ""
solanaRpcUrl: ""
corsOrigin: ""

# Shared environment variables injected into all components
env: {}

# Existing secret with env vars to inject into all components via envFrom
existingSecret: ""

# KMS / KEK configuration for the secrets package (gateway + worker only).
#
# When `provider` is set, KMS_PROVIDER is injected into both containers and
# the provider-specific config is applied:
#
#   - "local": the key referenced by `local.secretKey` in `existingSecret` is
#     mounted as a file at `<local.mountDir>/<local.fileName>`, and
#     KEK_LOCAL_PATH is set to that path. Suitable for dev.
#   - "gcp": GCP_KMS_KEY_NAME is set from `gcp.keyName`. The pod must run as a
#     ServiceAccount bound (via Workload Identity) to a GSA with
#     `cloudkms.cryptoKeyEncrypterDecrypter` on that key — configure via
#     `serviceAccount` below.
#
# Empty `provider` disables KMS env injection entirely.
kms:
  provider: ""
  local:
    secretKey: ""
    mountDir: /var/run/swarmforge
    fileName: kek.json
  gcp:
    keyName: ""

# Optional ServiceAccount for the gateway + worker pods. Useful with
# kms.provider=gcp + Workload Identity, or any other GCP-authenticated client.
# When create=false and name is empty, the namespace `default` SA is used.
serviceAccount:
  create: false
  name: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: app.example.com
  #    paths:
  #      - path: /
  #        service: web
  #  - host: api.example.com
  #    paths:
  #      - path: /
  #        service: gateway
  tls: []

# Subchart values
postgres:
  enabled: true
  auth:
    database: swarmforge
    username: swarmforge
    password: ""
    existingSecret: ""

valkey:
  enabled: true
  auth:
    enabled: false

falkordb:
  enabled: true
  service:
    port: 6380
