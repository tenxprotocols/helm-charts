---
# Default values for tenx-http-exporter.
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/tenxprotocols/tenx-http-exporter
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

replicaCount: 1

# -- Configuration for the http-exporter.
# If `existingConfigMap` is set, this is ignored.
# This value is rendered as-is into config.yml.
config: {}

# -- Name of an existing ConfigMap containing the exporter configuration.
# When set, the chart will not create a ConfigMap from `config`.
existingConfigMap: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

# -- Prometheus ServiceMonitor configuration.
# Requires the Prometheus Operator CRDs installed in the cluster.
serviceMonitor:
  enabled: false
  # -- Additional labels for the ServiceMonitor (e.g. release: kube-prometheus-stack).
  additionalLabels: {}
  # -- Scrape interval. If not set, the Prometheus default is used.
  interval: ""
  # -- Scrape timeout. If not set, the Prometheus default is used.
  scrapeTimeout: ""
  # -- MetricRelabelConfigs to apply to samples after scraping.
  metricRelabelings: []
  # -- RelabelConfigs to apply to targets before scraping.
  relabelings: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# -- Expose the service via gateway-api HTTPRoute.
# Requires Gateway API resources and suitable controller installed within the cluster.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /readyz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
