{{- if .Values.baker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tezos-octez.bakerFullname" . }}
  labels:
    {{- include "tezos-octez.labels" . | nindent 4 }}
    app.kubernetes.io/component: baker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tezos-octez.bakerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/keys: {{ include (print $.Template.BasePath "/client-keys-secret.yaml") . | sha256sum }}
        {{- with .Values.baker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tezos-octez.bakerSelectorLabels" . | nindent 8 }}
        tezos.io/chain: tezos
        tezos.io/network: {{ .Values.global.network }}
        {{- with .Values.baker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tezos-octez.serviceAccountName" . }}
      {{- with .Values.baker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-node
          image: "{{ .Values.baker.image.repository }}:{{ .Values.baker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.baker.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
          command:
            - /bin/sh
            - /etc/tezos/baker-wait.sh
          volumeMounts:
            - name: config
              mountPath: /etc/tezos
        {{- with .Values.baker.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: octez-baker
          image: "{{ .Values.baker.image.repository }}:{{ .Values.baker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.baker.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
            - name: BAKER_KEY_ALIAS
              value: {{ .Values.baker.bakerKeyAlias | quote }}
            - name: LIQUIDITY_BAKING_VOTE
              value: {{ .Values.baker.liquidityBakingVote | quote }}
            - name: CLIENT_DIR
              value: /home/tezos/.tezos-client
            {{- with .Values.baker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.baker.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              printf '{"liquidity_baking_toggle_vote":"%s"}\n' \
                "${LIQUIDITY_BAKING_VOTE}" \
                > "${CLIENT_DIR}/per_block_votes.json"
              exec octez-baker -E "${NODE_RPC_URL}" -d "${CLIENT_DIR}" \
                run remotely \
                {{- if .Values.baker.keepAlive }}
                --keep-alive \
                {{- end }}
                {{- if .Values.baker.recordState }}
                --record-state \
                {{- end }}
                {{- with .Values.baker.pidfile }}
                --pidfile {{ . | quote }} \
                {{- end }}
                {{- if not (kindIs "invalid" .Values.baker.preEmptiveForgeTime) }}
                --pre-emptive-forge-time {{ .Values.baker.preEmptiveForgeTime }} \
                {{- end }}
                {{- with .Values.baker.remoteCallsTimeout }}
                --remote-calls-timeout {{ . }} \
                {{- end }}
                {{- if not (kindIs "invalid" .Values.baker.minimalFees) }}
                --minimal-fees {{ .Values.baker.minimalFees }} \
                {{- end }}
                {{- if not (kindIs "invalid" .Values.baker.minimalNanotezPerGasUnit) }}
                --minimal-nanotez-per-gas-unit {{ .Values.baker.minimalNanotezPerGasUnit }} \
                {{- end }}
                {{- if not (kindIs "invalid" .Values.baker.minimalNanotezPerByte) }}
                --minimal-nanotez-per-byte {{ .Values.baker.minimalNanotezPerByte }} \
                {{- end }}
                {{- if .Values.baker.nodeVersionCheckBypass }}
                --node-version-check-bypass \
                {{- end }}
                {{- with .Values.baker.nodeVersionAllowed }}
                --node-version-allowed {{ . | quote }} \
                {{- end }}
                {{- if not (kindIs "invalid" .Values.baker.forceApplyFromRound) }}
                --force-apply-from-round {{ .Values.baker.forceApplyFromRound }} \
                {{- end }}
                {{- with .Values.baker.operationsPool }}
                --operations-pool {{ . | quote }} \
                {{- end }}
                {{- if .Values.dal.enabled }}
                --dal-node "http://{{ include "tezos-octez.dalFullname" . }}:{{ .Values.dal.rpc.port }}" \
                {{- else if .Values.dal.externalEndpoint }}
                --dal-node "{{ .Values.dal.externalEndpoint }}" \
                {{- else }}
                --without-dal \
                {{- end }}
                --votefile "${CLIENT_DIR}/per_block_votes.json" \
                {{- range .Values.baker.extraArgs }}
                {{ . }} \
                {{- end }}
                ${BAKER_KEY_ALIAS}{{- if .Values.baker.consensusKey }} consensus_key{{- end }}{{- if .Values.baker.companionKey }} companion_key{{- end }}
          {{- with .Values.baker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: client-dir
              mountPath: /home/tezos/.tezos-client
            - name: client-keys
              mountPath: /home/tezos/.tezos-client/secret_keys
              subPath: secret_keys
              readOnly: true
            - name: client-keys
              mountPath: /home/tezos/.tezos-client/public_keys
              subPath: public_keys
              readOnly: true
            - name: client-keys
              mountPath: /home/tezos/.tezos-client/public_key_hashs
              subPath: public_key_hashs
              readOnly: true
            - name: config
              mountPath: /etc/tezos
            {{- with .Values.baker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.baker.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: client-dir
          emptyDir: {}
        - name: client-keys
          secret:
            secretName: {{ .Values.signatory.auth.existingSecret | default (printf "%s-client-keys" (include "tezos-octez.fullname" .)) }}
        - name: config
          configMap:
            name: {{ include "tezos-octez.nodeFullname" . }}-config
            defaultMode: 0755
        {{- with .Values.baker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.baker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
