{{- if .Values.baker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tezos-octez.bakerFullname" . }}
  labels:
    {{- include "tezos-octez.labels" . | nindent 4 }}
    app.kubernetes.io/component: baker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tezos-octez.bakerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/keys: {{ include (print $.Template.BasePath "/client-keys-secret.yaml") . | sha256sum }}
        {{- with .Values.baker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tezos-octez.bakerSelectorLabels" . | nindent 8 }}
        tezos.io/chain: tezos
        tezos.io/network: {{ .Values.global.network }}
        {{- with .Values.baker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tezos-octez.serviceAccountName" . }}
      initContainers:
        - name: wait-for-node
          image: "{{ .Values.baker.image.repository }}:{{ .Values.baker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.baker.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
          command:
            - /bin/sh
            - /etc/tezos/baker-wait.sh
          volumeMounts:
            - name: config
              mountPath: /etc/tezos
      containers:
        - name: octez-baker
          image: "{{ .Values.baker.image.repository }}:{{ .Values.baker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.baker.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
            - name: BAKER_KEY_ALIAS
              value: {{ .Values.baker.bakerKeyAlias | quote }}
            - name: LIQUIDITY_BAKING_VOTE
              value: {{ .Values.baker.liquidityBakingVote | quote }}
            - name: CLIENT_DIR
              value: /home/tezos/.tezos-client
          command:
            - /bin/sh
            - -c
            - |
              set -e
              printf '{"liquidity_baking_toggle_vote":"%s"}\n' \
                "${LIQUIDITY_BAKING_VOTE}" \
                > "${CLIENT_DIR}/per_block_votes.json"
              exec octez-baker -E "${NODE_RPC_URL}" -d "${CLIENT_DIR}" \
                run remotely \
                {{- if .Values.dal.enabled }}
                --dal-node "http://{{ include "tezos-octez.dalFullname" . }}:{{ .Values.dal.rpc.port }}" \
                {{- else if .Values.dal.externalEndpoint }}
                --dal-node "{{ .Values.dal.externalEndpoint }}" \
                {{- else }}
                --without-dal \
                {{- end }}
                --votefile "${CLIENT_DIR}/per_block_votes.json" \
                ${BAKER_KEY_ALIAS}{{- if .Values.baker.consensusKey }} consensus_key{{- end }}{{- if .Values.baker.companionKey }} companion_key{{- end }}
          {{- with .Values.baker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: client-dir
              mountPath: /home/tezos/.tezos-client
            - name: client-keys
              mountPath: /home/tezos/.tezos-client/secret_keys
              subPath: secret_keys
              readOnly: true
            - name: client-keys
              mountPath: /home/tezos/.tezos-client/public_keys
              subPath: public_keys
              readOnly: true
            - name: client-keys
              mountPath: /home/tezos/.tezos-client/public_key_hashs
              subPath: public_key_hashs
              readOnly: true
            - name: config
              mountPath: /etc/tezos
      volumes:
        - name: client-dir
          emptyDir: {}
        - name: client-keys
          secret:
            secretName: {{ include "tezos-octez.fullname" . }}-client-keys
        - name: config
          configMap:
            name: {{ include "tezos-octez.nodeFullname" . }}-config
            defaultMode: 0755
      {{- with .Values.baker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
