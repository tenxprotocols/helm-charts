{{- if .Values.baker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tezos-octez.bakerFullname" . }}
  labels:
    {{- include "tezos-octez.labels" . | nindent 4 }}
    app.kubernetes.io/component: baker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tezos-octez.bakerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.baker.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.baker.metrics.port }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.baker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tezos-octez.bakerSelectorLabels" . | nindent 8 }}
        tezos.io/chain: tezos
        tezos.io/network: {{ .Values.global.network }}
        {{- with .Values.baker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tezos-octez.serviceAccountName" . }}
      initContainers:
        - name: wait-for-node
          image: "{{ .Values.baker.image.repository }}:{{ .Values.baker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.baker.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
          command:
            - /bin/sh
            - /etc/tezos/baker-wait.sh
          volumeMounts:
            - name: config
              mountPath: /etc/tezos
        - name: import-keys
          image: "{{ .Values.baker.image.repository }}:{{ .Values.baker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.baker.image.pullPolicy }}
          env:
            - name: CLIENT_DIR
              value: /home/tezos/.tezos-client
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
            - name: SIGNATORY_URL
              value: {{ .Values.signatory.endpoint | quote }}
            - name: KEY_PAIRS
              value: {{ printf "%s:%s" .Values.baker.bakerKeyAlias .Values.baker.bakerKey | quote }}
            {{- if .Values.baker.bakerSecretKey }}
            - name: SECRET_KEY
              value: {{ .Values.baker.bakerSecretKey | quote }}
            {{- end }}
            {{- if .Values.baker.bakerPublicKey }}
            - name: PUBLIC_KEY
              value: {{ .Values.baker.bakerPublicKey | quote }}
            {{- end }}
            {{- if .Values.signatory.authSecret }}
            - name: AUTH_DIR
              value: /etc/signatory-auth
            {{- end }}
          command:
            - /bin/sh
            - /etc/tezos/import-keys.sh
          volumeMounts:
            - name: client-dir
              mountPath: /home/tezos/.tezos-client
            - name: config
              mountPath: /etc/tezos
            {{- if .Values.signatory.authSecret }}
            - name: signatory-auth
              mountPath: /etc/signatory-auth
              readOnly: true
            {{- end }}
      containers:
        - name: octez-baker
          image: "{{ .Values.baker.image.repository }}:{{ .Values.baker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.baker.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
            - name: BAKER_KEY_ALIAS
              value: {{ .Values.baker.bakerKeyAlias | quote }}
            - name: LIQUIDITY_BAKING_VOTE
              value: {{ .Values.baker.liquidityBakingVote | quote }}
            - name: CLIENT_DIR
              value: /home/tezos/.tezos-client
          command:
            - /bin/sh
            - -c
            - |
              set -e
              printf '{"liquidity_baking_toggle_vote":"%s"}\n' \
                "${LIQUIDITY_BAKING_VOTE}" \
                > "${CLIENT_DIR}/per_block_votes.json"
              exec octez-baker -E "${NODE_RPC_URL}" -d "${CLIENT_DIR}" \
                run remotely \
                {{- if .Values.dal.enabled }}
                --dal-node "http://{{ include "tezos-octez.dalFullname" . }}:{{ .Values.dal.rpc.port }}" \
                {{- else if .Values.dal.externalEndpoint }}
                --dal-node "{{ .Values.dal.externalEndpoint }}" \
                {{- else }}
                --without-dal \
                {{- end }}
                --votefile "${CLIENT_DIR}/per_block_votes.json" \
                ${BAKER_KEY_ALIAS}
          {{- if .Values.baker.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.baker.metrics.port }}
              protocol: TCP
          {{- end }}
          {{- with .Values.baker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: client-dir
              mountPath: /home/tezos/.tezos-client
            - name: config
              mountPath: /etc/tezos
      volumes:
        - name: client-dir
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "tezos-octez.nodeFullname" . }}-config
            defaultMode: 0755
        {{- if .Values.signatory.authSecret }}
        - name: signatory-auth
          secret:
            secretName: {{ .Values.signatory.authSecret }}
        {{- end }}
      {{- with .Values.baker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
