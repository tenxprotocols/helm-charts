{{- if .Values.node.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tezos-octez.nodeFullname" . }}-config
  labels:
    {{- include "tezos-octez.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "data-dir": "/var/tezos/node/data",
      "network": {{ if .Values.global.networkConfig }}{{ toJson .Values.global.networkConfig }}{{ else }}{{ .Values.global.network | quote }}{{ end }},
      "rpc": {
        "listen-addrs": ["0.0.0.0:{{ .Values.node.rpc.port }}"],
        "acl": [
          {
            "address": "0.0.0.0:{{ .Values.node.rpc.port }}",
            "blacklist": []
          }
        ]
      },
      "p2p": {
        "listen-addr": "[::]:{{ .Values.node.p2p.port }}"
        {{- if .Values.node.peers }},
        "bootstrap-peers": {{ .Values.node.peers | toJson }}
        {{- end }}
      },
      "shell": {
        "history_mode": "{{ .Values.node.historyMode }}"
      },
      "metrics_addr": ["0.0.0.0:{{ .Values.node.metrics.port }}"]
    }

  baker-wait.sh: |
    #!/bin/sh
    set -e
    echo "Waiting for node to be fully synced..."
    while true; do
      RESULT=$(wget -qO- -T 2 "${NODE_RPC_URL}/chains/main/is_bootstrapped" 2>/dev/null || echo "")
      if echo "$RESULT" | grep -q '"sync_state":"synced"'; then
        echo "Node is synced."
        break
      fi
      echo "Node not yet synced. Retrying in 5s..."
      sleep 5
    done

  dal-run.sh: |
    #!/bin/sh
    # Restart loop for octez-dal to avoid Kubernetes CrashLoopBackOff.
    # The gossipsub worker can crash due to an upstream bug, causing
    # the DAL node to exit 1. This wrapper restarts it quickly with
    # a short fixed delay instead of Kubernetes' exponential backoff.

    # Per-pod p2p addressing (see dal.p2p.perPodPorts / dal.p2p.external).
    # Remote octez peers dedup connections by (observed IP, announced port);
    # replicas behind one egress IP must announce distinct ports or the
    # second one is rejected with Already_connected by every peer it dials.
    NET_ARGS=""
    if [ -n "$DAL_P2P_PORTS" ]; then
      ORDINAL="${HOSTNAME##*-}"
      NET_PORT=$(echo "$DAL_P2P_PORTS" | cut -d, -f$((ORDINAL + 1)))
      NET_ARGS="--net-addr 0.0.0.0:${NET_PORT}"
    fi
    if [ -n "$DAL_P2P_EXTERNAL_SERVICE_PREFIX" ]; then
      # Wait for this pod's LoadBalancer Service to get an external IP and
      # advertise it, so DAL peer exchange hands out a reachable address.
      SVC="${DAL_P2P_EXTERNAL_SERVICE_PREFIX}${ORDINAL}"
      TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      # busybox wget has no --ca-certificate; the bearer token still
      # authenticates us to the in-cluster apiserver.
      URL="https://kubernetes.default.svc/api/v1/namespaces/${POD_NAMESPACE}/services/${SVC}"
      while :; do
        PUBLIC_IP=$(wget -qO- --no-check-certificate \
          --header "Authorization: Bearer ${TOKEN}" "$URL" \
          | tr -d ' \n' | grep -o '"ip":"[0-9.]*"' | head -1 | grep -o '[0-9][0-9.]*')
        [ -n "$PUBLIC_IP" ] && break
        echo "Waiting for external IP on Service ${SVC}..."
        sleep 5
      done
      echo "Advertising public address ${PUBLIC_IP}:${DAL_P2P_PORT}"
      NET_ARGS="$NET_ARGS --public-addr ${PUBLIC_IP}:${DAL_P2P_PORT}"
    fi

    RESTART_DELAY=5
    while true; do
      echo "Starting DAL node..."
      # shellcheck disable=SC2086  # NET_ARGS is intentionally word-split
      octez-dal-node "$@" $NET_ARGS
      EXIT_CODE=$?
      echo "DAL node exited with code $EXIT_CODE. Restarting in ${RESTART_DELAY}s..."
      sleep "$RESTART_DELAY"
    done

  snapshot-download.sh: |
    #!/bin/sh
    set -e
    SNAPSHOT_FILE="/tmp/snapshot.file"
    MARKER_FILE="${DATA_DIR}/.snapshot-imported"

    # Skip if already imported or if context/store exists
    if [ -f "$MARKER_FILE" ]; then
      echo "Snapshot already imported (marker file exists). Skipping download."
      exit 0
    fi

    if [ -f "${DATA_DIR}/context/store.dict" ]; then
      echo "Node data already exists (context/store.dict found). Skipping download."
      exit 0
    fi

    SNAPSHOT_URL="${SNAPSHOT_SOURCE}/${NETWORK}/${SNAPSHOT_MODE}"

    echo "Downloading snapshot from $SNAPSHOT_URL..."
    wget -O "$SNAPSHOT_FILE" "$SNAPSHOT_URL"
    echo "Snapshot download complete."

  snapshot-import.sh: |
    #!/bin/sh
    set -e
    SNAPSHOT_FILE="/tmp/snapshot.file"
    MARKER_FILE="${DATA_DIR}/.snapshot-imported"

    if [ -f "$MARKER_FILE" ]; then
      echo "Snapshot already imported. Skipping."
      exit 0
    fi

    if [ ! -f "$SNAPSHOT_FILE" ]; then
      echo "No snapshot file found. Skipping import."
      exit 0
    fi

    if [ ! -f "${DATA_DIR}/config.json" ]; then
      echo "Initializing node config for ${NETWORK}..."
      octez-node config init --data-dir "${DATA_DIR}" --network "${NETWORK}"
    fi

    echo "Importing snapshot..."
    octez-node snapshot import "$SNAPSHOT_FILE" --data-dir "${DATA_DIR}" --no-check
    echo "Snapshot import complete."

    # Write marker file and clean up snapshot
    touch "$MARKER_FILE"
    rm -f "$SNAPSHOT_FILE"
    echo "Cleanup complete."
{{- end }}
