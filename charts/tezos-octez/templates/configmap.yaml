{{- if .Values.node.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tezos-octez.nodeFullname" . }}-config
  labels:
    {{- include "tezos-octez.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "data-dir": "/var/tezos/node/data",
      "network": "{{ .Values.global.network }}",
      "rpc": {
        "listen-addrs": ["0.0.0.0:{{ .Values.node.rpc.port }}"],
        "acl": [
          {
            "address": "0.0.0.0:{{ .Values.node.rpc.port }}",
            "blacklist": []
          }
        ]
      },
      "p2p": {
        "listen-addr": "[::]:{{ .Values.node.p2p.port }}"
        {{- if .Values.node.peers }},
        "bootstrap-peers": {{ .Values.node.peers | toJson }}
        {{- end }}
      },
      "shell": {
        "history_mode": "{{ .Values.node.historyMode }}"
      },
      "metrics_addr": ["0.0.0.0:{{ .Values.node.metrics.port }}"]
    }

  baker-wait.sh: |
    #!/bin/sh
    set -e
    echo "Waiting for node to be fully synced..."
    while true; do
      RESULT=$(wget -qO- "${NODE_RPC_URL}/chains/main/is_bootstrapped" 2>/dev/null || echo "")
      if echo "$RESULT" | grep -q '"sync_state":"synced"'; then
        echo "Node is synced."
        break
      fi
      echo "Node not yet synced. Retrying in 10s..."
      sleep 10
    done

  import-keys.sh: |
    #!/bin/sh
    set -e
    # import-keys.sh — Register keys in octez-client directory
    #
    # Env vars:
    #   CLIENT_DIR      octez-client directory
    #   NODE_RPC_URL    node RPC endpoint (for public key lookups)
    #   SIGNATORY_URL   Signatory endpoint
    #   KEY_PAIRS       space-delimited alias:address pairs to register
    #   SECRET_KEY      unencrypted secret key for direct signing (optional)
    #   PUBLIC_KEY      explicit public key, skips RPC lookup (optional)
    #   AUTH_DIR        path to mounted auth secret dir (optional)

    mkdir -p "${CLIENT_DIR}"

    # Build the Signatory base URL with auth key alias as username if present
    AUTH_ALIAS="signatory-auth"
    if [ -d "${AUTH_DIR:-}" ] && [ -f "${AUTH_DIR}/secret-key" ]; then
      # Insert auth alias as username: http://signatory-auth@host:port
      signatory_base=$(echo "${SIGNATORY_URL}" | sed "s|://|://${AUTH_ALIAS}@|")
    else
      signatory_base="${SIGNATORY_URL}"
    fi

    sk_entries=""
    pkh_entries=""
    pk_entries=""
    sep=""

    for pair in ${KEY_PAIRS}; do
      alias="${pair%%:*}"
      address="${pair#*:}"

      # Determine secret value
      if [ -n "${SECRET_KEY}" ]; then
        secret_val="unencrypted:${SECRET_KEY}"
      else
        secret_val="${signatory_base%/}/${address}"
      fi

      # Determine public key
      pub_key=""
      if [ -n "${PUBLIC_KEY}" ]; then
        pub_key="${PUBLIC_KEY}"
      else
        pub_key=$(wget -qO- "${NODE_RPC_URL}/chains/main/blocks/head/context/contracts/${address}/manager_key" 2>/dev/null | tr -d '"')
        [ "${pub_key}" = "null" ] && pub_key=""
      fi

      sk_entries="${sk_entries}${sep}{\"name\":\"${alias}\",\"value\":\"${secret_val}\"}"
      pkh_entries="${pkh_entries}${sep}{\"name\":\"${alias}\",\"value\":\"${address}\"}"
      if [ -n "${pub_key}" ]; then
        pk_entries="${pk_entries}${sep}{\"name\":\"${alias}\",\"value\":{\"locator\":\"${secret_val}\",\"key\":\"${pub_key}\"}}"
      fi
      sep=","
    done

    # Append Signatory auth key if mounted
    if [ -d "${AUTH_DIR:-}" ] && [ -f "${AUTH_DIR}/secret-key" ]; then
      auth_sk=$(cat "${AUTH_DIR}/secret-key")
      auth_pk=$(cat "${AUTH_DIR}/public-key")
      auth_pkh=$(cat "${AUTH_DIR}/public-key-hash")
      sk_entries="${sk_entries}${sep}{\"name\":\"signatory-auth\",\"value\":\"unencrypted:${auth_sk}\"}"
      pkh_entries="${pkh_entries}${sep}{\"name\":\"signatory-auth\",\"value\":\"${auth_pkh}\"}"
      pk_entries="${pk_entries}${sep}{\"name\":\"signatory-auth\",\"value\":{\"locator\":\"unencrypted:${auth_sk}\",\"key\":\"${auth_pk}\"}}"
    fi

    echo "[${sk_entries}]" > "${CLIENT_DIR}/secret_keys"
    echo "[${pkh_entries}]" > "${CLIENT_DIR}/public_key_hashs"
    echo "[${pk_entries}]" > "${CLIENT_DIR}/public_keys"

    echo "Registered keys in ${CLIENT_DIR}:"
    cat "${CLIENT_DIR}/public_key_hashs"

  snapshot-download.sh: |
    #!/bin/sh
    set -e
    SNAPSHOT_FILE="/tmp/snapshot.file"
    MARKER_FILE="${DATA_DIR}/.snapshot-imported"

    # Skip if already imported or if context/store exists
    if [ -f "$MARKER_FILE" ]; then
      echo "Snapshot already imported (marker file exists). Skipping download."
      exit 0
    fi

    if [ -f "${DATA_DIR}/context/store.dict" ]; then
      echo "Node data already exists (context/store.dict found). Skipping download."
      exit 0
    fi

    SNAPSHOT_URL="${SNAPSHOT_SOURCE}/${NETWORK}/${SNAPSHOT_MODE}"

    echo "Downloading snapshot from $SNAPSHOT_URL..."
    wget -O "$SNAPSHOT_FILE" "$SNAPSHOT_URL"
    echo "Snapshot download complete."

  snapshot-import.sh: |
    #!/bin/sh
    set -e
    SNAPSHOT_FILE="/tmp/snapshot.file"
    MARKER_FILE="${DATA_DIR}/.snapshot-imported"

    if [ -f "$MARKER_FILE" ]; then
      echo "Snapshot already imported. Skipping."
      exit 0
    fi

    if [ ! -f "$SNAPSHOT_FILE" ]; then
      echo "No snapshot file found. Skipping import."
      exit 0
    fi

    if [ ! -f "${DATA_DIR}/config.json" ]; then
      echo "Initializing node config for ${NETWORK}..."
      octez-node config init --data-dir "${DATA_DIR}" --network "${NETWORK}"
    fi

    echo "Importing snapshot..."
    octez-node snapshot import "$SNAPSHOT_FILE" --data-dir "${DATA_DIR}" --no-check
    echo "Snapshot import complete."

    # Write marker file and clean up snapshot
    touch "$MARKER_FILE"
    rm -f "$SNAPSHOT_FILE"
    echo "Cleanup complete."
{{- end }}
