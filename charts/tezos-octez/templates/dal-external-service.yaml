{{- /*
One LoadBalancer Service per DAL replica (index = pod ordinal), all bound to
the same static IP and distinguished by port: pod i is reachable at
<loadBalancerIP>:<portPrefix><i>, the exact address it announces via
--public-addr. External port = the pod's listen port, so no remapping and no
per-pod runtime configuration is needed.
*/ -}}
{{- if and .Values.dal.enabled .Values.dal.p2p.external.enabled }}
{{- $root := . }}
{{- range $i := until (int .Values.dal.replicaCount) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tezos-octez.dalFullname" $root }}-p2p-{{ $i }}
  labels:
    {{- include "tezos-octez.labels" $root | nindent 4 }}
    app.kubernetes.io/component: dal
spec:
  type: LoadBalancer
  loadBalancerIP: {{ $root.Values.dal.p2p.external.loadBalancerIP }}
  # Local avoids a second hop and preserves the client source IP; the
  # selector pins to a single pod, so there is no cross-node imbalance.
  externalTrafficPolicy: Local
  ports:
    - name: p2p
      port: {{ printf "%s%d" (toString $root.Values.dal.p2p.portPrefix) $i }}
      targetPort: {{ printf "%s%d" (toString $root.Values.dal.p2p.portPrefix) $i }}
      protocol: TCP
  selector:
    {{- include "tezos-octez.dalSelectorLabels" $root | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "tezos-octez.dalFullname" $root }}-{{ $i }}
---
{{- end }}
{{- end }}
