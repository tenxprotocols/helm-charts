{{- if .Values.dal.enabled -}}
{{- $allProfiles := concat (.Values.dal.attesterProfiles | default list) (.Values.dal.operatorProfiles | default list) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tezos-octez.dalFullname" . }}
  labels:
    {{- include "tezos-octez.labels" . | nindent 4 }}
    app.kubernetes.io/component: dal
spec:
  serviceName: {{ include "tezos-octez.dalFullname" . }}-headless
  replicas: {{ .Values.dal.replicaCount }}
  selector:
    matchLabels:
      {{- include "tezos-octez.dalSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/keys: {{ include (print $.Template.BasePath "/client-keys-secret.yaml") . | sha256sum }}
        {{- if .Values.dal.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.dal.metrics.port }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.dal.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tezos-octez.dalSelectorLabels" . | nindent 8 }}
        tezos.io/chain: tezos
        tezos.io/network: {{ .Values.global.network }}
        {{- with .Values.dal.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tezos-octez.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
      {{- if or $allProfiles .Values.dal.extraInitContainers }}
      initContainers:
        {{- if $allProfiles }}
        - name: wait-for-node
          image: "{{ .Values.dal.image.repository }}:{{ .Values.dal.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dal.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
          command:
            - /bin/sh
            - /etc/tezos/baker-wait.sh
          volumeMounts:
            - name: config
              mountPath: /etc/tezos
        {{- end }}
        {{- with .Values.dal.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: octez-dal
          image: "{{ .Values.dal.image.repository }}:{{ .Values.dal.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dal.image.pullPolicy }}
          env:
            - name: NODE_RPC_URL
              value: "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
            - name: DATA_DIR
              value: /var/tezos/dal
            {{- with .Values.dal.p2p.perPodPorts }}
            {{- if lt (len .) (int $.Values.dal.replicaCount) }}
            {{- fail "dal.p2p.perPodPorts must have at least dal.replicaCount entries" }}
            {{- end }}
            # Consumed by dal-run.sh: per-pod --net-addr, indexed by ordinal.
            - name: DAL_P2P_PORTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.dal.p2p.external.enabled }}
            {{- if not .Values.dal.p2p.perPodPorts }}
            {{- fail "dal.p2p.external.enabled requires dal.p2p.perPodPorts" }}
            {{- end }}
            # Consumed by dal-run.sh: discover this pod's LoadBalancer IP
            # (Service <prefix><ordinal>) and announce --public-addr.
            - name: DAL_P2P_EXTERNAL_SERVICE_PREFIX
              value: {{ include "tezos-octez.dalFullname" . }}-p2p-
            - name: DAL_P2P_PORT
              value: {{ .Values.dal.p2p.port | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- with .Values.dal.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.dal.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - /etc/tezos/dal-run.sh
          args:
            - run
            - --data-dir
            - /var/tezos/dal
            - -E
            - "http://{{ include "tezos-octez.nodeFullname" . }}:{{ .Values.node.rpc.port }}"
            - --rpc-addr
            - "0.0.0.0:{{ .Values.dal.rpc.port }}"
            {{- if not .Values.dal.p2p.perPodPorts }}
            - --net-addr
            - "0.0.0.0:{{ .Values.dal.p2p.port }}"
            {{- end }}
            {{- if .Values.dal.metrics.enabled }}
            - --metrics-addr
            - "0.0.0.0:{{ .Values.dal.metrics.port }}"
            {{- end }}
            {{- if .Values.dal.attesterProfiles }}
            - --attester-profiles
            - {{ .Values.dal.attesterProfiles | join "," | quote }}
            {{- end }}
            {{- if .Values.dal.operatorProfiles }}
            - --operator-profiles
            - {{ .Values.dal.operatorProfiles | join "," | quote }}
            {{- end }}
            {{- if .Values.dal.observerProfiles }}
            - --observer-profiles
            - {{ .Values.dal.observerProfiles | join "," | quote }}
            {{- end }}
            {{- if .Values.dal.bootstrapProfile }}
            - --bootstrap-profile
            {{- end }}
            {{- if .Values.dal.peers }}
            - --peers
            - {{ .Values.dal.peers | join "," | quote }}
            {{- end }}
            - --history-mode
            - {{ .Values.dal.historyMode | quote }}
            {{- with .Values.dal.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: rpc
              containerPort: {{ .Values.dal.rpc.port }}
              protocol: TCP
            # With perPodPorts, the actual listen port is the ordinal-indexed
            # list entry; this declaration is informational (per-pod LB
            # Services target the per-pod port numerically).
            - name: p2p
              containerPort: {{ .Values.dal.p2p.port }}
              protocol: TCP
            {{- if .Values.dal.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.dal.metrics.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /version
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /version
              port: rpc
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /version
              port: rpc
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.dal.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/tezos
            - name: dal-data
              mountPath: /var/tezos/dal
            {{- with .Values.dal.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.dal.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tezos-octez.nodeFullname" . }}-config
            defaultMode: 0755
        {{- with .Values.dal.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.dal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: dal-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.dal.storage.storageClass }}
        storageClassName: {{ .Values.dal.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.dal.storage.size }}
{{- end }}
