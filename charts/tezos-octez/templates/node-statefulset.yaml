{{- if .Values.node.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tezos-octez.nodeFullname" . }}
  labels:
    {{- include "tezos-octez.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  serviceName: {{ include "tezos-octez.nodeFullname" . }}-headless
  replicas: {{ .Values.node.replicaCount }}
  selector:
    matchLabels:
      {{- include "tezos-octez.nodeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.node.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.node.metrics.port }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.node.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tezos-octez.nodeSelectorLabels" . | nindent 8 }}
        {{- with .Values.node.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tezos-octez.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: config-init
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.node.image.pullPolicy }}
          env:
            - name: DATA_DIR
              value: /var/tezos/node/data
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p "${DATA_DIR}"
              cp /etc/tezos/config.json "${DATA_DIR}/config.json"
              if [ ! -f "${DATA_DIR}/identity.json" ]; then
                echo "Generating node identity..."
                octez-node identity generate --data-dir "${DATA_DIR}"
              fi
          volumeMounts:
            - name: data
              mountPath: /var/tezos/node
            - name: config
              mountPath: /etc/tezos
        {{- if .Values.snapshot.enabled }}
        - name: snapshot-download
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.node.image.pullPolicy }}
          env:
            - name: DATA_DIR
              value: /var/tezos/node/data
            - name: NETWORK
              value: {{ .Values.global.network | quote }}
            - name: SNAPSHOT_SOURCE
              value: {{ .Values.snapshot.source | quote }}
            - name: SNAPSHOT_MODE
              value: {{ .Values.snapshot.mode | quote }}
          command:
            - /bin/sh
            - /etc/tezos/snapshot-download.sh
          {{- with .Values.snapshot.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/tezos/node
            - name: config
              mountPath: /etc/tezos
            - name: snapshot-tmp
              mountPath: /tmp
        - name: snapshot-import
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.node.image.pullPolicy }}
          env:
            - name: DATA_DIR
              value: /var/tezos/node/data
            - name: NETWORK
              value: {{ .Values.global.network | quote }}
          command:
            - /bin/sh
            - /etc/tezos/snapshot-import.sh
          {{- with .Values.snapshot.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/tezos/node
            - name: config
              mountPath: /etc/tezos
            - name: snapshot-tmp
              mountPath: /tmp
        {{- end }}
      containers:
        - name: octez-node
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.node.image.pullPolicy }}
          command:
            - octez-node
          args:
            - run
            - --data-dir
            - /var/tezos/node/data
            - --rpc-addr
            - "0.0.0.0:{{ .Values.node.rpc.port }}"
            - --net-addr
            - "[::]:{{ .Values.node.p2p.port }}"
            {{- if .Values.node.metrics.enabled }}
            - --metrics-addr
            - "0.0.0.0:{{ .Values.node.metrics.port }}"
            {{- end }}
          ports:
            - name: rpc
              containerPort: {{ .Values.node.rpc.port }}
              protocol: TCP
            - name: p2p
              containerPort: {{ .Values.node.p2p.port }}
              protocol: TCP
            {{- if .Values.node.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.node.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /version
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /version
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          {{- with .Values.node.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/tezos/node
            - name: config
              mountPath: /etc/tezos
      volumes:
        - name: config
          configMap:
            name: {{ include "tezos-octez.nodeFullname" . }}-config
            defaultMode: 0755
        {{- if .Values.snapshot.enabled }}
        - name: snapshot-tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.node.storage.storageClass }}
        storageClassName: {{ .Values.node.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.node.storage.size }}
{{- end }}
