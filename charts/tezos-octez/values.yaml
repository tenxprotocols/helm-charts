# Default values for tezos-octez.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Tezos network name (e.g. mainnet, ghostnet)
  network: mainnet
  # Tezos protocol (used for baker binary selection)
  protocol: PtTallinn

signatory:
  # Signatory remote signer endpoint, shared by baker and DAL node
  endpoint: "http://signatory.signatory.svc.cluster.local:6732"
  # Signatory authorized_keys authentication. When set, the auth pkh is
  # used as the URL username and the key is registered in the client.
  auth:
    secretKey: ""       # edsk...
    publicKey: ""       # edpk...
    publicKeyHash: ""   # tz1...

node:
  enabled: true
  image:
    repository: tezos/tezos
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  # Replica count for the node StatefulSet
  replicaCount: 1
  storage:
    size: 250Gi
    storageClass: "premium-rwo"
  # Node history mode: full, rolling, archive
  historyMode: rolling
  # Additional bootstrap peers
  peers: []
  rpc:
    port: 8732
  p2p:
    port: 9732
  metrics:
    enabled: true
    port: 9932
  resources: {}
    # limits:
    #   cpu: "4"
    #   memory: 16Gi
    # requests:
    #   cpu: "2"
    #   memory: 8Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

baker:
  enabled: true
  image:
    repository: tezos/tezos
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  bakerKey: ""
  # Public key (edpk...) for the baker. Required when the key has not been
  # revealed on chain yet (node RPC won't return it). When empty, the
  # public key is fetched from the node RPC.
  bakerPublicKey: ""
  # Unencrypted secret key (edsk...). When set, the baker uses this
  # directly instead of a remote signer. Mutually exclusive with signatory.
  bakerSecretKey: ""
  bakerKeyAlias: baker
  # Consensus key address (tz4...). When the baker key has delegated
  # consensus to another key, set this so the baker can sign with it.
  consensusKey: ""
  # BLS public key (BLpk...) for the consensus key. Required for the
  # baker to sign attestations with the consensus key.
  consensusPublicKey: ""
  # Companion key address (tz4...). Set when using a companion key
  # alongside the consensus key.
  companionKey: ""
  # BLS public key (BLpk...) for the companion key.
  companionPublicKey: ""
  liquidityBakingVote: "pass"
  resources: {}
    # limits:
    #   cpu: "1"
    #   memory: 2Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

dal:
  enabled: true
  # External DAL node endpoint. When set, the baker uses this instead of the in-chart DAL node.
  # Set enabled: false and externalEndpoint to use an external DAL node.
  # Set both to false/empty to run --without-dal.
  externalEndpoint: ""
  image:
    repository: tezos/tezos
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  rpc:
    port: 10732
  p2p:
    port: 11732
  metrics:
    enabled: true
    port: 11733
  # DAL node profiles
  attesterProfiles: []
  operatorProfiles: []
  observerProfiles: []
  bootstrapProfile: false
  # Additional DAL peers
  peers: []
  # History mode: number, "full", or "auto"
  historyMode: "auto"
  storage:
    size: 50Gi
    storageClass: "premium-rwo"
  resources: {}
    # limits:
    #   cpu: "2"
    #   memory: 4Gi
    # requests:
    #   cpu: "1"
    #   memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

snapshot:
  enabled: true
  # Snapshot download URL (default: tzinit.org rolling snapshot)
  source: "https://snapshots.tzinit.org"
  # Snapshot mode: rolling or full
  mode: rolling
  resources: {}
    # limits:
    #   cpu: "1"
    #   memory: 2Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""
