# Default values for tezos-octez.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# ── Common extension points ─────────────────────────────────────────────
# Each component (node, baker, accuser, dal) exposes the same set of
# extension knobs so you can layer in extra config without forking the
# chart:
#
#   extraArgs           list[string]              appended to the daemon CLI
#   extraEnv            list[corev1.EnvVar]       appended to main-container env
#   extraEnvFrom        list[corev1.EnvFromSource] appended to main-container envFrom
#   extraVolumes        list[corev1.Volume]       added to the pod spec
#   extraVolumeMounts   list[corev1.VolumeMount]  added to the main container
#   extraInitContainers list[corev1.Container]    appended after chart init containers
#   extraContainers     list[corev1.Container]    sidecar containers in the pod
#
# All default to [] (no-op). Lists are rendered as-is — use standard
# Kubernetes object syntax. Example for the baker:
#
#   baker:
#     extraArgs:
#       - --allow-signing-delay
#     extraEnv:
#       - name: TEZOS_LOG
#         value: '* -> notice'
#       - name: GCP_PROJECT
#         valueFrom:
#           secretKeyRef:
#             name: gcp-creds
#             key: project_id
#     extraEnvFrom:
#       - configMapRef:
#           name: extra-baker-env
#     extraVolumes:
#       - name: gcp-sa
#         secret:
#           secretName: gcp-sa-json
#     extraVolumeMounts:
#       - name: gcp-sa
#         mountPath: /etc/gcp
#         readOnly: true
#     extraContainers:
#       - name: log-forwarder
#         image: fluent/fluent-bit:3.0
#         # ...

global:
  # Short, label-safe network name used for K8s labels, fullnames, log
  # filters, and the snapshot URL path. Must be one of the built-in Octez
  # network aliases (sandbox, mainnet, ghostnet, shadownet) UNLESS
  # `networkConfig` is set below, in which case this can be any label-safe
  # identifier (e.g. "bakingnet", "ushuaianet") and `networkConfig` provides
  # the actual network parameters.
  network: mainnet

  # Inline network configuration for non-built-in networks. When non-empty,
  # this YAML object is rendered as a JSON object into the node config.json
  # "network" field. Use this for community testnets (bakingnet, ushuaianet,
  # weeklynet, etc.) by copying the relevant entry from
  # https://teztnets.com/teztnets.json. Quote ISO-8601 timestamps as strings
  # so YAML doesn't decode them as datetime types.
  #
  # Required fields: chain_name, sandboxed_chain_name, genesis.
  # Optional fields per the Octez blockchain_network encoding.
  #
  # Example:
  # networkConfig:
  #   chain_name: TEZOS_BAKINGNET_2026-04-08T20:00:00Z
  #   sandboxed_chain_name: SANDBOXED_TEZOS
  #   genesis:
  #     block: BMKHqWxBQ3WD2H3D5fyjxbnfxEX9FdqXvxPmXfhwjCFmjG6Wuxh
  #     protocol: Ps9mPmXaRzmzk35gbAYNCAw6UXdE2qoABTHbN2oEEc1qM7CwT9P
  #     timestamp: "2026-04-08T20:00:00Z"
  #   default_bootstrap_peers:
  #     - bakingnet.teztnets.com
  networkConfig: {}

signatory:
  # Signatory remote signer endpoint, shared by baker and DAL node
  endpoint: "http://signatory.signatory.svc.cluster.local:6732"
  # Signatory authorized_keys authentication. When set, the auth pkh is
  # used as the URL username and the key is registered in the client.
  auth:
    secretKey: ""       # edsk...
    publicKey: ""       # edpk...
    publicKeyHash: ""   # tz1...
    # When set, the chart does NOT render the <fullname>-client-keys Secret;
    # the baker instead mounts this externally-managed Secret of the same
    # shape (secret_keys / public_key_hashs / public_keys). Use this to keep
    # the auth edsk out of git — e.g. populated from a secret store via an
    # ExternalSecret. Takes precedence over the secretKey/publicKey above.
    existingSecret: ""  # name of an existing client-keys Secret

node:
  enabled: true
  image:
    repository: tezos/tezos
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  # Replica count for the node StatefulSet
  replicaCount: 1
  storage:
    size: 250Gi
    storageClass: "premium-rwo"
  # Node history mode: full, rolling, archive
  historyMode: rolling
  # Additional bootstrap peers
  peers: []
  rpc:
    port: 8732
  p2p:
    port: 9732
  metrics:
    enabled: true
    port: 9932

  # Extension points — see "Common extension points" comment block at the
  # top of this file.
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []
  extraContainers: []

  resources: {}
    # limits:
    #   cpu: "4"
    #   memory: 16Gi
    # requests:
    #   cpu: "2"
    #   memory: 8Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

baker:
  enabled: true
  image:
    repository: tezos/tezos
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  bakerKey: ""
  # Public key (edpk...) for the baker. Required when the key has not been
  # revealed on chain yet (node RPC won't return it). When empty, the
  # public key is fetched from the node RPC.
  bakerPublicKey: ""
  # Unencrypted secret key (edsk...). When set, the baker uses this
  # directly instead of a remote signer. Mutually exclusive with signatory.
  bakerSecretKey: ""
  bakerKeyAlias: baker
  # Consensus key address (tz4...). When the baker key has delegated
  # consensus to another key, set this so the baker can sign with it.
  consensusKey: ""
  # BLS public key (BLpk...) for the consensus key. Required for the
  # baker to sign attestations with the consensus key.
  consensusPublicKey: ""
  # Companion key address (tz4...). Set when using a companion key
  # alongside the consensus key.
  companionKey: ""
  # BLS public key (BLpk...) for the companion key.
  companionPublicKey: ""
  liquidityBakingVote: "pass"

  # ── octez-baker `run remotely` tuning flags ─────────────────────────────
  # Each flag below is conditionally rendered: unset (~ / "" / [] / false)
  # preserves the octez default. Quoted descriptions come verbatim from
  # `octez-baker run remotely --help` (octez-v24.4). See the man page for
  # the authoritative source.

  # --keep-alive
  # "Keep the daemon process alive: when the connection with the node is
  # lost, the daemon periodically tries to reach it."
  # Recommended on in Kubernetes: without it the baker exits on transient
  # node-RPC disconnects and depends on the pod restart loop to reconnect.
  keepAlive: true

  # --record-state
  # "If record-state flag is set, the baker saves all its internal consensus
  # state in the filesystem, otherwise just in memory."
  # Recommended on: prevents accidental equivocation if the baker votes then
  # crashes before the next round. Persists to the client base-dir, which is
  # an emptyDir in this chart — state survives container restarts within the
  # same pod, but not pod recreation. For full crash-safety across pod
  # recreation, mount a PersistentVolumeClaim at /home/tezos/.tezos-client.
  recordState: true

  # --pre-emptive-forge-time <seconds>
  # "Sets the pre-emptive forge time optimization, in seconds. When set, the
  # baker, if it is the next level round 0 proposer, will start forging
  # after quorum has been reached in the current level while idly waiting
  # for it to end. ... Operators should note that the higher this value `t`,
  # the lower the operation inclusion window (specifically `block_time - t`)
  # which may lead to lower baking rewards. Defaults to 15% of block time.
  # Set to 0 to ignore pre-emptive forging."
  # Note: 0 is a meaningful explicit value (disables the optimization).
  # Use ~ for the octez default.
  preEmptiveForgeTime: ~

  # --remote-calls-timeout <seconds>
  # "Sets a timeout for client calls such as signing block header or
  # attestation and for the creation of deterministic nonce. Use only if
  # your remote signer can handle concurrent requests."
  # Unset preserves the octez default (no timeout). A tight value lets the
  # baker fail fast on a wedged signatory replica and retry, allowing
  # kube-proxy to route the retry to a healthy backend before the consensus
  # round expires.
  remoteCallsTimeout: ~

  # --minimal-fees <tez>
  # "exclude operations with fees lower than this threshold (in tez)"
  # Floor for total operation fees. Combine with the two nanotez floors
  # below for a full inclusion policy.
  minimalFees: ~

  # --minimal-nanotez-per-gas-unit <nanotez>
  # "exclude operations with fees per gas lower than this threshold (in
  # nanotez)"
  minimalNanotezPerGasUnit: ~

  # --minimal-nanotez-per-byte <nanotez>
  # "exclude operations with fees per byte lower than this threshold (in
  # nanotez)"
  minimalNanotezPerByte: ~

  # --node-version-check-bypass
  # "If node-version-check-bypass flag is set, the baker will not check its
  # compatibility with the version of the node to which it is connected."
  # Useful during upgrade windows where baker and node binaries are briefly
  # out of sync. Prefer nodeVersionAllowed below for narrower scope.
  nodeVersionCheckBypass: false

  # --node-version-allowed <product-[v]MAJOR.MINOR[.0]<info>[:<commit>]>
  # "When specified the baker will accept to run with a node of this
  # version. The specified version is composed of the product, for example
  # 'octez'; the major and the minor versions that are positive integers;
  # the info, for example '-rc', '-beta1+dev' or realese if none is
  # provided; optionally the commit that is the hash of the last git commit
  # or a prefix of at least 8 characters long."
  # More precise than nodeVersionCheckBypass.
  nodeVersionAllowed: ""

  # --force-apply-from-round <round>
  # "Force the baker to not only validate but also apply operations starting
  # from the specified round."
  # Operator escape hatch. Note: 0 is a valid round number, so use ~ for
  # "unset" rather than 0.
  forceApplyFromRound: ~

  # --operations-pool <file|uri>
  # "When specified, the baker will try to fetch operations from this file
  # (or uri) and to include retrieved operations in the block. The expected
  # format of the contents is a list of operations [ alpha.operation ].
  # Environment variable
  # 'TEZOS_CLIENT_REMOTE_OPERATIONS_POOL_HTTP_HEADERS' may also be specified
  # to add headers to the requests (only 'host' headers are supported). If
  # the resource cannot be retrieved, e.g., if the file is absent,
  # unreadable, or the web service returns a 404 error, the resource is
  # simply ignored."
  operationsPool: ""

  # --pidfile <filename>
  # "write process id in file"
  # Mostly useful with external supervisors; container runtimes provide
  # their own PID 1 semantics so this is rarely needed.
  pidfile: ""

  # ── Extension points ────────────────────────────────────────────────────
  # See "Common extension points" comment block at the top of this file.
  # extraArgs for the baker is appended to the `octez-baker run remotely`
  # invocation, after all the flags above and before the positional baker
  # key alias. Entries are NOT shell-escaped, so quote any values containing
  # spaces yourself.
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []
  extraContainers: []

  resources: {}
    # limits:
    #   cpu: "1"
    #   memory: 2Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  # podSecurityContext is applied at the pod level (spec.template.spec.securityContext).
  # Most commonly used to set sysctls — e.g. lower TCP SYN retries so a dead
  # signatory drops the connect attempt fast enough to retry the next
  # block/attestation slot:
  #   podSecurityContext:
  #     sysctls:
  #       - name: net.ipv4.tcp_syn_retries
  #         value: "2"   # ~7s connect timeout (1+2+4); default kernel is ~127s
  podSecurityContext: {}

accuser:
  # The octez-accuser daemon watches the chain for double-baking and
  # double-attesting and publishes slashing evidence (denunciation ops).
  # Lightweight (single process, no signing keys, no DAL) and independent
  # of the baker. Off by default — flip to true for production validators.
  enabled: false
  image:
    repository: tezos/tezos
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # ── octez-accuser `run` tuning flags ────────────────────────────────────
  # Quoted descriptions come verbatim from `octez-accuser run --help`
  # (octez-v24.4).

  # --keep-alive
  # "Keep the daemon process alive: when the connection with the node is
  # lost, the daemon periodically tries to reach it."
  # Same rationale as baker.keepAlive — recommended on.
  keepAlive: true

  # --preserved-levels <threshold>
  # "Number of effective levels kept in the accuser's memory"
  # Tunes how many recent levels the accuser retains to detect
  # equivocations. Unset preserves the octez default.
  preservedLevels: ~

  # --pidfile <filename>
  # "write process id in file"
  pidfile: ""

  # ── Extension points ────────────────────────────────────────────────────
  # See "Common extension points" comment block at the top of this file.
  # extraArgs for the accuser is appended to the `octez-accuser run`
  # invocation. Entries are NOT shell-escaped, so quote any values
  # containing spaces yourself.
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []
  extraContainers: []

  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 512Mi
    # requests:
    #   cpu: 50m
    #   memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  # podSecurityContext is applied at the pod level
  # (spec.template.spec.securityContext). See baker.podSecurityContext for
  # the same TCP-tuning escape hatch.
  podSecurityContext: {}

dal:
  enabled: true
  # External DAL node endpoint. When set, the baker uses this instead of the in-chart DAL node.
  # Set enabled: false and externalEndpoint to use an external DAL node.
  # Set both to false/empty to run --without-dal.
  externalEndpoint: ""
  image:
    repository: tezos/tezos
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  rpc:
    port: 10732
  p2p:
    port: 11732
  metrics:
    enabled: true
    port: 11733
  # DAL node profiles
  attesterProfiles: []
  operatorProfiles: []
  observerProfiles: []
  bootstrapProfile: false
  # Additional DAL peers
  peers: []
  # History mode: number, "full", or "auto"
  historyMode: "auto"
  storage:
    size: 50Gi
    storageClass: "premium-rwo"

  # Extension points — see "Common extension points" comment block at the
  # top of this file.
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []
  extraContainers: []

  resources: {}
    # limits:
    #   cpu: "2"
    #   memory: 4Gi
    # requests:
    #   cpu: "1"
    #   memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

snapshot:
  enabled: true
  # Snapshot download URL (default: tzinit.org rolling snapshot)
  source: "https://snapshots.tzinit.org"
  # Snapshot mode: rolling or full
  mode: rolling
  resources: {}
    # limits:
    #   cpu: "1"
    #   memory: 2Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""
